<bs-snippet name="connect4" title="Connect 4"
  description="Synced multiplayer upright Connect 4 board with a reset button."
  script="https://connect4.firer.at/snippet.js"
  room=""
  position="0 1.2 2"
  rotation="0 0 0"
  scale="1"
  lit="true"
  add-lights="false"
  turn-cooldown="5"
  hide-ui="false"
  hide-board="false"
  use-custom-models="true"
  reset-position="0 -0.06 0"
  reset-rotation="0 0 0"
  reset-scale="1"
  scoreboard-position="0 0 0"
  scoreboard-rotation="0 0 0"
  scoreboard-scale="1">
  <bs-gizmo type="position" attribute="position"/>
  <bs-gizmo type="plane" attribute="position" size="0.72 0.62"/>
</bs-snippet>
